<article class="group reveal">
  <a href="{{ post.get_absolute_url }}" class="block">
    <div class="relative aspect-[3/4] overflow-hidden rounded-2xl">
      {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" alt="{{ post.cover_alt }}" loading="lazy" class="absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-105">
      {% else %}
        {% include "partials/art.html" with n=post.pk %}
      {% endif %}
      <span class="absolute left-3 top-3 rounded-full bg-paper/90 px-3 py-1 text-xs font-semibold text-body">{{ post.category.name }}</span>
    </div>
    <h3 class="mt-4 font-display text-xl font-semibold leading-snug decoration-clay decoration-2 underline-offset-4 group-hover:underline">{{ post.title }}</h3>
    <p class="mt-2 line-clamp-2 text-sm text-muted">{{ post.excerpt }}</p>
    <p class="mt-3 text-xs font-medium text-accent">{{ post.reading_time }} min read · <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"M j, Y" }}</time></p>
  </a>
</article>
