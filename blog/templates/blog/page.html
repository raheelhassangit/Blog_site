{% extends "base.html" %}
{% block content %}
<article class="mx-auto max-w-3xl px-5 pb-8 pt-10 md:px-8 md:pt-16">
  <h1 class="font-display text-4xl font-semibold tracking-tight md:text-6xl">{{ page.title }}</h1>
  <p class="mt-3 text-sm text-muted">Last updated {{ page.updated_at|date:"F j, Y" }}</p>
  <div class="prose-post mt-10">{{ page.body|safe }}</div>
</article>
{% endblock %}
